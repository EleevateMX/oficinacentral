# Actualizaciones automáticas de librerías. Cada pull request corre las pruebas (CI)
# antes de que alguien lo acepte.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels: [dependencias]
    groups:
      # Parches y versiones menores juntas en un solo PR
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps"
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencias, escritorio]
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
